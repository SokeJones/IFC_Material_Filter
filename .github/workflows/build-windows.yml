name: Build Windows portable EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'filter_engine.py'
      - 'extract_export.py'
      - 'performance.py'
      - 'batch_export.py'
      - 'reachability_diagnostics.py'
      - 'step_prune.py'
      - 'validation_v14.py'
      - 'validation_v146.py'
      - 'placement_repair.py'
      - 'geometry_verification.py'
      - 'cli.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone program
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name IFC_Material_Filter --collect-all ifcopenshell --collect-all ifcpatch --hidden-import ifcpatch.recipes.ExtractElements --collect-all psutil --hidden-import ifcopenshell.validate --hidden-import ifcopenshell.api.geometry.edit_object_placement --hidden-import ifcopenshell.geom app.py
      - name: Package portable EXE
        shell: pwsh
        run: Compress-Archive -Path dist/IFC_Material_Filter.exe -DestinationPath IFC_Material_Filter_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IFC_Material_Filter_Windows
          path: IFC_Material_Filter_Windows.zip
          retention-days: 30
